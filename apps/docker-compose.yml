version: '3.8'

services:
  monitoring:
    image: registry.digitalocean.com/pokedesk-cr/ha-monitoring:latest  # Replace with your registry if using one
    configs:
      - source: registry-auth
        target: /root/.docker/config.json
        mode: 0444
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker  # This will ensure it runs on worker nodes
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    # env_file passes every var from .env into the container. The previous
    # `environment:` block re-declared three of them as ${VAR}, which docker
    # compose interpolates against the deploying shell -- and when the stack
    # was deployed without `set -a; . .env; set +a` first, those resolved to
    # empty strings and SHADOWED the real values from env_file.
    env_file:
      - .env

secrets:
  registry_auth:
    external: true

configs:
  registry-auth:
    external: true